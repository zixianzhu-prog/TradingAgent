[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fund-lab"
version = "0.1.0"
description = "Paper-only modular AI trading research lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
market-data = ["yfinance>=0.2.54"]
openbb-data = ["openbb-core>=2.0", "openbb-equity>=2.0", "openbb-yfinance>=2.0"]
alpaca = ["alpaca-py>=0.35"]
dev = ["pytest>=8"]

[project.scripts]
ai-fund-lab = "ai_fund_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
