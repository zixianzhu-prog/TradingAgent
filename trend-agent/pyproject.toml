[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-agent"
version = "0.1.0"
description = "Paper-only trend intelligence monitor for emerging technology and policy signals"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trend-agent = "trend_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
